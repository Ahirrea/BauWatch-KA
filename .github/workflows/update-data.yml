name: Baustellendaten aktualisieren

on:
  schedule:
    # Alle 4 Stunden (UTC). Für tageweise gültige Baustellendaten ausreichend.
    - cron: "0 */4 * * *"
  workflow_dispatch: {} # manuell auslösbar

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # TEMPORARY, on the A-17 branch only (A-17 step 1, ADR-007): fetch the
      # district boundaries once and commit them to this branch. The regular
      # data build is left out on purpose, so that no data commit lands here.
      # This file is reset to main's version right after the run.
      - name: Stadtteilgrenzen holen (A-17, einmalig)
        run: node scripts/fetch-districts.mjs

      - name: Stadtteilgrenzen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/districts.geojson
          if git diff --cached --quiet; then
            echo "Keine Änderung an den Stadtteilgrenzen."
          else
            git commit -m "data: district boundaries, fetched once (A-17 step 1, ADR-007)"
            git push
          fi
