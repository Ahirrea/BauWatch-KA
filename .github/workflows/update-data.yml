# ⚠️ TEMPORÄR AUF DIESEM BRANCH VERÄNDERT — Schritt 10 aus
# docs/anforderungen/A-7-baustellenflaechen.md.
#
# Diese Datei ist auf dem Feature-Branch bewusst auf „nur inspizieren"
# umgestellt: ein neuer Workflow lässt sich per API nicht auslösen (GitHub
# registriert workflow_dispatch nur für Workflows auf dem Standard-Branch),
# ein Dispatch von update-data.yml mit ref=<branch> führt aber die Fassung
# DIESES Branches aus. Der geplante Cron-Lauf ist davon nicht betroffen — der
# nimmt immer die Fassung von main.
#
# Vor dem Zusammenführen wird diese Datei wieder auf den Stand von main
# zurückgesetzt. Kein Commit, kein Push, contents: read.
name: Baustellendaten aktualisieren

on:
  workflow_dispatch: {} # manuell auslösbar

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: WFS-Geometrien inspizieren (temporär, nur lesend)
        run: node scripts/inspect-wfs-geometrie.mjs
